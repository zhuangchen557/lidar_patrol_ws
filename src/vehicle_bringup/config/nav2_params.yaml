# nav2_params.yaml — 07-4L 巡检车 Nav2 导航参数
# 适配: 差速底盘, 激光 /scan (frame=laser), odom 来自 chassis_bridge
# 车辆: 轮径0.37m 轮距0.60m 碰撞半径0.30m(2026-08-28实车调整, 便于窄道通行) | 限速 v=0.5m/s ω=1.0rad/s
# 参考: Humble nav2_bringup 默认参数, 按本车修改


# ============================================================
# 全局/局部代价地图
# ============================================================

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      robot_base_frame: base_link
      global_frame: map
      footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      robot_base_frame: base_link
      global_frame: odom
      footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["voxel_layer", "inflation_layer"]
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True

# ============================================================
# 控制服务器 (RegulatedPurePursuit)
# ============================================================

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      min_linear_vel: 0.05
      max_linear_accel: 0.3
      max_linear_decel: 0.3
      lookahead_dist: 1.2
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      allow_reversing: false

# ============================================================
# 规划服务器 (navfn)
# ============================================================

planner_server:
  ros__parameters:
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: true

# ============================================================
# 行为服务器 (恢复行为)
# ============================================================

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    global_frame: map
    robot_base_frame: base_link
    costmap_topic_map: /global_costmap/costmap
    costmap_topic_global: /global_costmap/costmap
    footstep_topic: /footsteps
    compute_footsteps: true
    local_planner: FollowPath
    global_planner: GridBased
    footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
    transform_tolerance: 0.1
    min_rot_vel: 0.5
    max_rot_vel: 1.0
    min_trans_vel: 0.1
    max_trans_vel: 0.5

# ============================================================
# 平滑器 (路径平滑, 差速)
# ============================================================

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ============================================================
# BT 导航器
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
# ============================================================
# 路径点跟随 (巡检用)
# ============================================================

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 3

# ============================================================
# 速度平滑器 (差速)
# ============================================================

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    deadband_accel: [0.0, 0.0, 0.0]


# ============================================================
# AMCL 定位（必须显式配置，默认 base_frame_id=base_footprint 会报错）
# ============================================================
amcl:
  ros__parameters:
    base_frame_id: base_link
# ============================================================
# 碰撞监控（缺段会导致 configure 失败，Aborting bringup）
# ============================================================
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    enable_stamped_cmd_vel: true
    enable_collision_prevention: true
    collision_prevention_distance: 0.2
    polygons:
    - RobotFootprint
    observation_sources:
    - scan
    RobotFootprint:
      type: polygon
      action_type: stop
      polygon_sub_topic: 
      footprint: '[[-0.30, -0.30], [-0.30, 0.30], [0.30, 0.30], [0.30, -0.30]]'
      min_points: 4
      pose_frame: base_link
    scan:
      type: scan
      topic: scan
      min_points: 4
      max_points: 500
      min_height: 0.1
      max_height: 2.0
      enabled: true
      pose_frame: base_link

# ============================================================
# opennav_docking（无充电桩，空配置让 configure 通过）
# ============================================================
opennav_docking:
  ros__parameters:
    dock_namespaces: []
    dock_plugins: []
    docks: {}

# ============================================================
# opennav_docking（SimpleChargingDock 标准模板，本车无桩仅为配置通过）
# ============================================================
opennav_docking:
  ros__parameters:
    dock_namespaces: ['dock_1']
    dock_plugins: ['dock_1::opennav_docking::SimpleChargingDock']
    docks:
      dock_1:
        type: 'undock_backwards'
        frame_id: 'dock_1'
        dock_plugin: 'dock_1::opennav_docking::SimpleChargingDock'
        yaw: 0.0
        x: -0.6
        y: 0.0
        use_external_detection_pose: false
        external_detection_pose:
          x: 0.0
          y: 0.0
          yaw: 0.0
